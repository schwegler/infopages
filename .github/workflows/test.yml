name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: python -m pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      # Match the established WebKit QA engine; 27.2 emits style-src-attr
      # violations for bare native selects (see docs/appearance-webkit-qa.md).
      - run: npm install --prefix /tmp/infopages-webkit --no-save playwright@1.62.1
      - run: /tmp/infopages-webkit/node_modules/.bin/playwright install --with-deps webkit
      - run: python -m pytest tests/browser -q
      - name: Check Appearance, mascot parade and Sudoku with the established WebKit engine
        run: |
          export INFO_PAGES_BROWSER_EXECUTABLE="$(node -e "console.log(require('/tmp/infopages-webkit/node_modules/playwright').webkit.executablePath())")"
          python -m pytest tests/browser/test_appearance.py tests/browser/test_mascot_parade.py tests/browser/test_sudoku_layout.py -q --browser webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-qa
          path: artifacts/
          if-no-files-found: ignore
